dding:13px 18px;box-shadow:var(--shadow);z-index:60}.hidden{display:none!important}.mobile-menu{display:none}.footer-note{font-size:12px;color:var(--muted);margin-top:25px}.badge{border-radius:8px;background:#eff1fc;padding:6px 9px;font-size:12px;font-weight:800}.backward{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}.backward-goal{border-radius:22px;background:#fff0c6;padding:25px;border:2px solid var(--gold)}.backward-box{border-radius:18px;border:1px solid var(--line);background:#fff;padding:19px}.head-with-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.search{max-width:350px}.category-badge{font-size:11px;padding:5px 9px;border-radius:8px;font-weight:850;background:#e6e5ff;color:#6856ac}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.help{font-size:13px;color:var(--muted);line-height:1.6}.inline-add{display:flex;gap:8px}.inline-add input{flex:1}.seq-list{display:flex;flex-direction:column;gap:10px}.row-title{font-size:18px;font-weight:850}.category-line{border-left:5px solid #9265e8}.danger{color:#d34754}.compact{font-size:13px}.svg-export{background:#fff}

</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="mark">✦</div><div><strong>SEQUENCE<br>STUDIO</strong><small>by BROT2YOU</small></div></div><nav class="nav" id="navigation"></nav><div class="sidebar-foot">✦ Creative Pop Edition<br>Vos séquences, votre créativité.</div></aside><main class="workspace"><header class="topbar"><div class="crumb" id="breadcrumb">My Sequences<small>Creative teaching starts here</small></div><div class="actions"><span class="pill hide-small" id="saveState">● Enregistré</span><button class="btn ghost hide-small" id="importBtn">↥ Import JSON</button><button class="btn ghost" id="exportBtn">↧ Export</button><button class="btn primary" id="newBtn">＋ Séquence</button></div></header><section class="content" id="screen"></section></main></div><input class="hidden" type="file" accept=".json,application/json" id="importFile"><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';
const $=q=>document.querySelector(q), $$=q=>Array.from(document.querySelectorAll(q));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demo=()=>({id:uid(),title:'Welcome to London!',level:'5e',axis:'Voyages et explorations',problem:'How can we help a visitor discover London?',cefr:'A1–A2',duration:'5 séances',prerequisites:'Présenter simplement un lieu et comprendre des informations courtes.',finalTask:{title:'Create an interactive London travel guide',context:'Un guide pour des visiteurs anglophones',audience:'English-speaking visitors',product:'Guide touristique interactif',criteria:'Informations fiables, description claire, conseils pertinents'},objectives:[{id:uid(),category:'Culturels',text:'Découvrir les monuments emblématiques de Londres'},{id:uid(),category:'Culturels',text:'Identifier des caractéristiques de la capitale britannique'},{id:uid(),category:'Linguistiques',text:'There is / There are'},{id:uid(),category:'Linguistiques',text:'Can et lexique des monuments'},{id:uid(),category:'Linguistiques',text:'Prépositions de lieu et indications de direction'},{id:uid(),category:'Pragmatiques',text:'Décrire et localiser un monument'},{id:uid(),category:'Pragmatiques',text:'Conseiller et donner des indications'}],steps:[{id:uid(),title:'Discover London',objective:'Découvrir les monuments de Londres',support:'Photographies et documents courts',duration:'1 séance',activities:'CO, CE',intermediate:false},{id:uid(),title:'Explore the City',objective:'Comprendre des descriptions et situer des lieux',support:'Plan de Londres',duration:'1 séance',activities:'CE, EE',intermediate:false},{id:uid(),title:'Find Your Way',objective:'Comprendre et donner des indications',support:'Plan et dialogue',duration:'1 séance',activities:'CO, EOI',intermediate:true},{id:uid(),title:'Recommend a Place',objective:'Présenter et recommander un monument',support:'Documents culturels',duration:'1 séance',activities:'EOC, EE',intermediate:false}],links:{},updated:Date.now(),archived:false,favorite:true});
let data,activeId=null,view='dashboard',visual='stairs',history=[],redo=[];const KEY='brot2you-sequence-studio-v1';
try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.sequences)){data={sequences:[demo()]};localStorage.setItem(KEY,JSON.stringify(data))}activeId=data.sequences[0]?.id||null;
function seq(){return data.sequences.find(x=>x.id===activeId)}
function persist(){const e=$('#saveState');if(e)e.textContent='◌ Sauvegarde…';try{localStorage.setItem(KEY,JSON.stringify(data));if(e)e.textContent='● Enregistré'}catch(err){if(e)e.textContent='⚠ Stockage saturé';toast('Échec de la sauvegarde locale : exportez vos données.')}}
function snapshot(){history.push(JSON.stringify(data));if(history.length>35)history.shift();redo=[]}
function mutate(fn){snapshot();fn();if(seq())seq().updated=Date.now();persist();render()}
function update(key,val){mutate(()=>{seq()[key]=val})}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3300)}
const nav=[['dashboard','▦','My Sequences'],['designer','✎','Sequence Designer'],['visual','◇','Visual Studio'],['backward','↶','Backward Design'],['dual','⊞','Dual View'],['inspector','▣','Inspector View'],['objectives','◎','Objectifs & CECRL'],['export','⇩','Export Studio']];
function go(v){view=v;render()}
function render(){if(!seq()&&view!=='dashboard')view='dashboard';$('#navigation').innerHTML=nav.map(([id,ico,label])=>`<button class="${view===id?'active':''}" data-nav="${id}" title="${label}"><span aria-hidden="true">${ico}</span><span class="label">${label}</span></button>`).join('');$('#breadcrumb').innerHTML=`${esc(view==='dashboard'?'My Sequences':nav.find(x=>x[0]===view)?.[2])}<small>${esc(view==='dashboard'?'Creative teaching starts here':seq()?.title||'')}</small>`;const screen=$('#screen');screen.innerHTML=({dashboard,designer,visual:visualScreen,backward,dual,inspector,objectives,export:exportScreen}[view])();$$('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));bindCommon();}
const field=(label,key,value,kind='text')=>`<div class="field"><label>${label}</label>${kind==='textarea'?`<textarea data-field="${key}">${esc(value)}</textarea>`:`<input data-field="${key}" value="${esc(value)}">`}</div>`;
const header=(h,sub)=>`<div class="section-heading"><div><h2>${h}</h2>${sub?`<div class="help">${sub}</div>`:''}</div></div>`;
function dashboard(){return `<div class="hero"><h1>Vos idées prennent forme ✦</h1><p>Concevez, visualisez et partagez vos séquences d'anglais avec Creative Pop.</p></div><div class="head-with-controls">${header('My Teaching Sequences','Votre bibliothèque de séquences pédagogiques')}<input class="search" id="search" placeholder="⌕ Rechercher une séquence…"></div><div class="grid" id="cards">${cards()}</div><div class="footer-note">🔒 Vos données sont enregistrées dans ce navigateur. Pensez à exporter régulièrement une sauvegarde JSON.</div>`}
function cards(filter=''){let items=data.sequences.filter(s=>!s.archived&&[s.title,s.level,s.axis].join(' ').toLowerCase().includes(filter.toLowerCase()));return items.length?items.map(s=>`<article class="seq-card" data-open="${s.id}"><div class="card-row"><span class="pill">✦ ${esc(s.level)}</span><span>${s.favorite?'⭐':'📚'}</span></div><h3>${esc(s.title)}</h3><div class="category-badge">${esc(s.axis||'Axe à définir')}</div><p>${esc(s.problem||'Ajoutez une problématique')}</p><div class="card-row"><span class="muted compact">▥ ${s.steps.length} étapes</span><span class="muted compact">${new Date(s.updated).toLocaleDateString('fr-FR')}</span></div><div class="hline"></div><div class="card-row"><button class="btn primary" data-open="${s.id}">Ouvrir ↗</button><button class="icon-btn" data-dup="${s.id}" title="Dupliquer">⧉</button><button class="icon-btn" data-archive="${s.id}" title="Archiver">▤</button></div></article>`).join(''):`<div class="empty">Aucune séquence trouvée. Cliquez sur « + Séquence » pour commencer.</div>`}
function designer(){let s=seq();return `<div class="hero"><h1>Sequence Designer ✏️</h1><p>Donnez une structure solide à votre projet pédagogique.</p></div><div class="two-col"><div class="panel">${header('Identité de la séquence')}${field('Titre','title',s.title)}${field('Niveau','level',s.level)}${field('Axe culturel','axis',s.axis)}${field('Problématique','problem',s.problem,'textarea')}${field('Niveau CECRL','cefr',s.cefr)}${field('Durée prévisionnelle','duration',s.duration)}${field('Prérequis','prerequisites',s.prerequisites,'textarea')}</div><div class="panel">${header('🏆 Final Task','Le point d’aboutissement de la séquence')}${field('Intitulé','final.title',s.finalTask.title)}${field('Situation de communication','final.context',s.finalTask.context,'textarea')}${field('Destinataire','final.audience',s.finalTask.audience)}${field('Production attendue','final.product',s.finalTask.product)}${field('Critères de réussite','final.criteria',s.finalTask.criteria,'textarea')}</div></div><div class="two-col"><div class="panel">${header('🪜 Étapes de progression','Chaque étape correspond à une marche de votre escalier')}<div class="seq-list">${s.steps.map((st,i)=>`<div class="entry"><div><div class="card-row"><h4>${i+1}. ${esc(st.title)} ${st.intermediate?'🟠':''}</h4><button class="btn ghost compact" data-editstep="${st.id}">Modifier</button></div><p>${esc(st.objective)}</p></div><button class="icon-btn" data-upstep="${st.id}" title="Monter">↑</button><button class="icon-btn" data-downstep="${st.id}" title="Descendre">↓</button><button class="icon-btn" data-delstep="${st.id}" title="Supprimer">×</button></div>`).join('')}</div><button class="btn primary" data-addstep>＋ Ajouter une étape</button></div><div class="panel">${header('◎ Objectifs pédagogiques','Reliez ensuite chaque objectif aux marches dans Dual View')}<div class="seq-list">${s.objectives.map(o=>`<div class="entry category-line"><div><span class="category-badge">${esc(o.category)}</span><h4>${esc(o.text)}</h4></div><button class="icon-btn" data-editobj="${o.id}">✎</button><button class="icon-btn" data-delobj="${o.id}">×</button></div>`).join('')}</div><button class="btn primary" data-addobj>＋ Ajouter un objectif</button></div></div>`}
function visualScreen(){let s=seq();return `<div class="hero"><h1>Visual Studio ◇</h1><p>Une séquence, plusieurs regards. Toutes vos représentations restent synchronisées.</p></div><div class="tabs">${[['stairs','🪜 Escalier'],['map','🧠 Mind Map'],['journey','↝ Learning Journey']].map(([id,l])=>`<button data-visual="${id}" class="${visual===id?'active':''}">${l}</button>`).join('')}</div><div class="panel"><div class="head-with-controls"><div><h2 style="margin:0">${esc(s.title)}</h2><p class="muted compact">${esc(s.problem)}</p></div><div class="actions no-print"><button class="btn ghost" id="pngBtn">↧ PNG</button><button class="btn ghost" onclick="window.print()">⎙ PDF / Imprimer</button></div></div><div id="visual-area">${visual==='stairs'?stairs():visual==='map'?mindmap():journey()}</div></div><p class="help">Cliquez sur une étape pour la modifier. Dans la Mind Map, cliquez sur un objectif pour le modifier. Les boutons d'export PNG exportent la vue courante.</p>`}
function stairs(){let s=seq(),steps=[...s.steps,{id:'final',title:s.finalTask.title,objective:s.finalTask.product,duration:'Tâche finale',intermediate:false}];return `<div class="stair-scroller"><div class="stairs">${steps.map((st,i)=>`<button class="step ${st.id==='final'?'final-step':''}" data-number="${st.id==='final'?'🏆 FINAL TASK':`STEP ${i+1}`}" data-editstep="${st.id==='final'?'final':st.id}" style="height:${Math.min(370,165+i*37)}px"><h4>${esc(st.title)}</h4><p>${esc(st.objective)}</p><span>${st.intermediate?'● INTERMEDIATE TASK':esc(st.duration||'ÉTAPE')}</span></button>`).join('')}</div></div>`}
function mindmap(){let s=seq(),objectives=s.objectives;let groups=['Culturels','Linguistiques','Pragmatiques','Sociolinguistiques','Méthodologiques','Activités langagières','Séances','Tâche finale'];let colors=['#ffab73','#6bb9f8','#ae8cf0','#f38ac2','#52cba0','#9265e8','#4169f5','#ffc857'];let nodes=[];groups.forEach((cat,i)=>{let angle=(i/groups.length)*Math.PI*2-Math.PI/2,x=570+Math.cos(angle)*340,y=300+Math.sin(angle)*228;let objs=cat==='Séances'?s.steps.map(st=>st.title):cat==='Tâche finale'?[s.finalTask.title]:objectives.filter(o=>o.category===cat).map(o=>o.text);nodes.push({cat,x,y,color:colors[i],items:objs.slice(0,3),id:cat})});let lines=nodes.map(n=>`<path d="M 570 300 Q ${(570+n.x)/2} ${Math.min(300,n.y)-26} ${n.x} ${n.y}" stroke="${n.color}" stroke-width="4" fill="none" opacity=".65"/>`).join('');let boxes=nodes.map(n=>`<g class="node-wrap" data-mgroup="${esc(n.id)}"><rect x="${n.x-118}" y="${n.y-40}" width="236" height="${Math.max(80,58+n.items.length*23)}" rx="19" fill="#fff" stroke="${n.color}" stroke-width="3"/><rect x="${n.x-118}" y="${n.y-40}" width="236" height="35" rx="17" fill="${n.color}"/><text x="${n.x}" y="${n.y-17}" text-anchor="middle" font-size="14" font-weight="800" fill="#26324b">${esc(n.cat)}</text>${n.items.map((t,j)=>`<text x="${n.x}" y="${n.y+10+j*22}" font-size="11" text-anchor="middle" fill="#26324b">${esc(t.length>33?t.slice(0,31)+'…':t)}</text>`).join('')}${n.items.length===0?`<text x="${n.x}" y="${n.y+19}" font-size="11" text-anchor="middle">＋ Ajouter</text>`:''}</g>`).join('');return `<div class="canvas mindmap"><svg id="mapSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" role="img" aria-label="Carte mentale de la séquence"><rect width="1140" height="640" fill="white"/>${lines}<rect x="428" y="244" width="284" height="112" rx="24" fill="#4169f5"/><text x="570" y="278" text-anchor="middle" font-size="21" font-weight="900" fill="white">${esc(s.title.length>24?s.title.slice(0,22)+'…':s.title)}</text><foreignObject x="453" y="292" width="234" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="color:white;text-align:center;font:12px sans-serif;line-height:1.3">${esc(s.problem)}</div></foreignObject>${boxes}</svg></div>`}
function journey(){let s=seq();return `<div class="timeline"><div class="t-node" style="background:#e7ebff"><b>🚀 START</b><p class="help">${esc(s.prerequisites)}</p></div>${s.steps.map((st,i)=>`<div class="arrow">→</div><button class="t-node" data-editstep="${st.id}"><b>STEP ${i+1}</b><h3>${esc(st.title)}</h3><p class="help">${esc(st.objective)}</p>${st.intermediate?'<span class="pill">Intermediate task</span>':''}</button>`).join('')}<div class="arrow">→</div><button class="t-node" data-editstep="final" style="background:#fff0c1"><b>🏆 FINAL TASK</b><h3>${esc(s.finalTask.title)}</h3></button></div>`}
function backward(){let s=seq();return `<div class="hero"><h1>Backward Design ↶</h1><p>Commencez par la tâche finale pour construire les apprentissages nécessaires.</p></div><div class="backward"><div class="backward-goal"><span class="pill">🏆 01 · FINAL TASK</span><h2>${esc(s.finalTask.title||'Définir la tâche finale')}</h2><p>${esc(s.finalTask.context||'Décrivez la situation de communication.')}</p>${field('Tâche finale','final.title',s.finalTask.title)}${field('Production attendue','final.product',s.finalTask.product)}${field('Critères de réussite','final.criteria',s.finalTask.criteria,'textarea')}<p class="help">La tâche finale est partagée avec toutes les autres vues.</p></div><div class="backward-box"><span class="pill">◎ 02 · COMPÉTENCES</span><h2>Quels savoirs et savoir-faire mobiliser ?</h2>${s.objectives.map(o=>`<div class="entry"><div><span class="category-badge">${esc(o.category)}</span> ${esc(o.text)}</div></div>`).join('')}<button class="btn ghost" data-addobj>＋ Ajouter un objectif</button></div><div class="backward-box"><span class="pill">◈ 03 · ÉTAPES</span><h2>Préparer la tâche finale</h2>${s.steps.map((st,i)=>`<div class="entry"><div><b>${i+1}. ${esc(st.title)}</b><p>${esc(st.objective)}</p></div><button class="icon-btn" data-editstep="${st.id}">✎</button></div>`).join('')}<button class="btn ghost" data-addstep>＋ Ajouter une étape</button></div><div class="backward-box" style="background:#edf0ff"><span class="pill">🪜 04 · PARCOURS</span><h2>Construire l'escalier</h2><p class="help">Les étapes saisies alimentent automatiquement l'escalier pédagogique et le Dual View.</p><button class="btn primary" data-goto="visual">Voir le Learning Path →</button></div></div>`}
function matrixContent(){let s=seq();return `<div class="matrix-scroll"><table class="matrix"><thead><tr><th>Objectif</th>${s.steps.map((st,i)=>`<th>${i+1}. ${esc(st.title)}</th>`).join('')}</tr></thead><tbody>${s.objectives.map(o=>`<tr><td><span class="category-badge">${esc(o.category)}</span><br>${esc(o.text)}</td>${s.steps.map(st=>`<td><select aria-label="Progression de ${esc(o.text)} dans ${esc(st.title)}" data-link="${o.id}|${st.id}"><option value="">—</option>${[['I','Introduit'],['P','Entraîné'],['R','Réinvesti'],['E','Évalué']].map(([k,t])=>`<option value="${k}" ${(s.links?.[o.id]?.[st.id]||'')===k?'selected':''}>${t}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function dual(){let s=seq();let total=s.objectives.length*s.steps.length,filled=Object.values(s.links||{}).reduce((n,o)=>n+Object.values(o).filter(Boolean).length,0);return `<div class="hero"><h1>Dual View ⊞</h1><p>Reliez la progression de votre séquence aux objectifs pédagogiques.</p></div><div class="stats"><div class="stat"><b>${s.steps.length}</b> étapes</div><div class="stat"><b>${s.objectives.length}</b> objectifs</div><div class="stat"><b>${filled}/${total}</b> liens renseignés</div></div><div class="panel" style="margin-top:20px"><h2>🪜 Learning Path</h2>${stairs()}</div><div class="panel"><h2>◎ Matrice de progression</h2><p class="help">Pour chaque objectif, indiquez son statut dans chaque séance. Les changements sont enregistrés immédiatement.</p>${matrixContent()}</div>`}
function miniStairs(){let s=seq();return `<div class="mini-stairs">${[...s.steps,{title:'FINAL TASK'}].map((st,i)=>`<div style="height:${Math.min(145,48+24*i)}px">${i+1}. ${esc(st.title)}</div>`).join('')}</div>`}
function inspector(){let s=seq();return `<div class="hero no-print"><h1>Inspector View ▣</h1><p>Une synthèse claire et professionnelle de votre séquence.</p></div><div class="head-with-controls no-print" style="margin-bottom:20px"><span class="help">Version prête pour présentation et impression.</span><button class="btn primary" onclick="window.print()">⎙ Exporter PDF / Imprimer</button></div><article class="preview" id="inspector-preview"><div class="colorbar"></div><div class="card-row"><span class="pill">ENGLISH · ${esc(s.level)} · ${esc(s.cefr)}</span><span class="muted">SEQUENCE STUDIO by BROT2YOU</span></div><h1>${esc(s.title)}</h1><h3>${esc(s.problem)}</h3><p class="muted">Axe culturel : ${esc(s.axis)} · Durée : ${esc(s.duration)}</p><div class="hline"></div><h2>◎ Learning Objectives</h2><div class="grid">${['Culturels','Linguistiques','Pragmatiques','Sociolinguistiques','Méthodologiques'].map(cat=>{let a=s.objectives.filter(o=>o.category===cat);return a.length?`<div class="entry"><div><span class="category-badge">${cat}</span><p style="line-height:1.6;margin-top:9px;color:var(--text)">${a.map(o=>esc(o.text)).join('<br>')}</p></div></div>`:''}).join('')}</div><h2>🪜 Learning Path</h2>${miniStairs()}<h2>🏆 Final Task</h2><div class="final"><h3>${esc(s.finalTask.title)}</h3><p>${esc(s.finalTask.context)}</p><p><b>Destinataire :</b> ${esc(s.finalTask.audience)}<br><b>Production :</b> ${esc(s.finalTask.product)}<br><b>Critères :</b> ${esc(s.finalTask.criteria)}</p></div><div class="footer-note">Synthèse pédagogique générée avec SEQUENCE STUDIO — by BROT2YOU</div></article>`}
function objectives(){let s=seq(),cats=['Culturels','Linguistiques','Pragmatiques','Sociolinguistiques','Méthodologiques','Activités langagières'];return `<div class="hero"><h1>Objectifs & CECRL ◎</h1><p>Des objectifs transparents, liés à votre progression et à la tâche finale.</p></div><div class="note">Les références officielles aux programmes et au CECRL ne sont pas encore intégrées à cette première version. Les objectifs ci-dessous sont modifiables et ne constituent pas des citations réglementaires.</div><div class="two-col">${cats.map(cat=>`<div class="panel"><div class="head-with-controls"><h2>${esc(cat)}</h2><button class="btn ghost" data-addobjcat="${esc(cat)}">＋</button></div>${s.objectives.filter(o=>o.category===cat).map(o=>`<div class="entry"><div>${esc(o.text)}</div><button class="icon-btn" data-editobj="${o.id}">✎</button><button class="icon-btn" data-delobj="${o.id}">×</button></div>`).join('')||'<p class="help">Aucun objectif renseigné.</p>'}</div>`).join('')}</div>`}
function exportScreen(){return `<div class="hero"><h1>Export Studio ⇩</h1><p>Sauvegardez, partagez et présentez votre travail.</p></div><div class="two-col"><div class="panel"><h2>📦 Sauvegarde de projet</h2><p class="help">Exportez l'ensemble de vos séquences en JSON pour les réimporter sur cet appareil ou un autre.</p><button class="btn primary" id="jsonDownload">↧ Télécharger JSON</button></div><div class="panel"><h2>📄 Dossier professionnel</h2><p class="help">La Vue inspecteur est optimisée pour l'impression. Dans la fenêtre d'impression, choisissez « Enregistrer au format PDF ».</p><button class="btn primary" data-goto="inspector">Ouvrir Inspector View</button></div><div class="panel"><h2>🎨 Image de votre visualisation</h2><p class="help">La carte mentale et l'escalier peuvent être exportés sous forme d'image PNG.</p><button class="btn primary" data-goto="visual">Ouvrir Visual Studio</button></div><div class="panel"><h2>🔐 Confidentialité</h2><p class="help">Vos données sont enregistrées localement dans ce navigateur. Aucun compte n'est nécessaire. Effacer les données du navigateur peut supprimer les séquences non exportées.</p><button class="btn ghost" id="jsonImport">↥ Importer une sauvegarde</button></div></div>`}
function ask(message,def=''){let x=prompt(message,def);return x===null?null:x.trim()}
function editStep(id){let s=seq();if(id==='final'){go('designer');return}let st=s.steps.find(x=>x.id===id);if(!st)return;let title=ask('Titre de l’étape',st.title);if(title===null||!title)return;let objective=ask('Objectif / production attendue',st.objective);if(objective===null)return;let duration=ask('Durée',st.duration);if(duration===null)return;let support=ask('Supports',st.support||'');if(support===null)return;let intermediate=confirm('Cette étape comporte-t-elle une tâche intermédiaire ?\nOK : oui · Annuler : non');mutate(()=>Object.assign(st,{title,objective,duration,support,intermediate}))}
function addStep(){let title=ask('Titre de la nouvelle étape','New step');if(!title)return;let objective=ask('Objectif principal','');if(objective===null)return;mutate(()=>seq().steps.push({id:uid(),title,objective,duration:'1 séance',support:'',activities:'',intermediate:false}))}
function addObjective(cat){let category=cat||ask('Catégorie (Culturels, Linguistiques, Pragmatiques, Sociolinguistiques, Méthodologiques, Activités langagières)','Linguistiques');if(!category)return;let t=ask('Formulation de l’objectif','');if(!t)return;mutate(()=>seq().objectives.push({id:uid(),category,text:t}))}
function editObj(id){let o=seq().objectives.find(x=>x.id===id);if(!o)return;let text=ask('Modifier l’objectif',o.text);if(text===null||!text)return;mutate(()=>o.text=text)}
function download(name,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function saveJSON(){download('sequence-studio-sauvegarde.json',JSON.stringify({app:'SEQUENCE STUDIO',version:1,sequences:data.sequences},null,2),'application/json');toast('Sauvegarde JSON téléchargée')}
function doImport(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!Array.isArray(o.sequences)||o.sequences.length>500)throw Error('Format invalide');for(let s of o.sequences){if(!s||typeof s.id!=='string'||!Array.isArray(s.steps)||!Array.isArray(s.objectives)||!s.finalTask)throw Error('Séquence invalide')}if(!confirm('Remplacer votre bibliothèque actuelle par les séquences importées ? Exportez d’abord une sauvegarde si nécessaire.'))return;snapshot();data={sequences:o.sequences};activeId=data.sequences[0]?.id||null;persist();go('dashboard');toast('Séquences importées')}catch(e){toast('Import impossible : '+e.message)}};r.readAsText(file);$('#importFile').value=''}
function exportPNG(){let node=$('#visual-area');if(!node)return;if(visual==='map'){let svg=$('#mapSvg').cloneNode(true);let xml=new XMLSerializer().serializeToString(svg);drawSvgPNG(xml,1140,640);return}let text=seq();let w=Math.max(1160,text.steps.length*210+360),h=600,svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="#faf9f6"/><text x="45" y="65" font-family="Arial" font-size="32" font-weight="bold" fill="#26324b">${esc(text.title)}</text><text x="45" y="98" font-family="Arial" font-size="17" fill="#68748b">${esc(text.problem)}</text>${[...text.steps,{title:text.finalTask.title,objective:text.finalTask.product}].map((st,i)=>{let x=35+i*205,y=470-i*64,height=90+i*60;return `<rect x="${x}" y="${y-height+90}" width="192" height="${height}" rx="15" fill="${i===text.steps.length?'#ffc857':['#d9edff','#eaddff','#d5faea','#ffe3de','#fff0c7'][i%5]}"/><text x="${x+15}" y="${y-height+126}" font-size="13" font-family="Arial" font-weight="bold" fill="#26324b">${esc((i===text.steps.length?'FINAL TASK':`STEP ${i+1}`))}</text><text x="${x+15}" y="${y-height+151}" font-size="13" font-family="Arial" fill="#26324b">${esc(st.title.slice(0,24))}</text></svg>`}).join('')}</svg>`;drawSvgPNG(svg,w,h)}
function drawSvgPNG(src,w,h){const img=new Image,blob=new Blob([src],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob);img.onload=()=>{let c=document.createElement('canvas');c.width=w*2;c.height=h*2;let ctx=c.getContext('2d');ctx.scale(2,2);ctx.drawImage(img,0,0,w,h);c.toBlob(b=>{if(b){let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='sequence-studio-'+visual+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}},'image/png');URL.revokeObjectURL(url)};img.onerror=()=>toast('Erreur de génération PNG');img.src=url}
function bindCommon(){const screen=$('#screen');$$('[data-field]').forEach(el=>{el.onchange=()=>{let key=el.dataset.field,v=el.value;mutate(()=>{if(key.startsWith('final.'))seq().finalTask[key.slice(6)]=v;else seq()[key]=v})}});$$('[data-open]').forEach(el=>el.onclick=e=>{e.stopPropagation();activeId=el.dataset.open;go('designer')});$$('[data-dup]').forEach(el=>el.onclick=e=>{e.stopPropagation();let o=data.sequences.find(s=>s.id===el.dataset.dup);mutate(()=>{let n=structuredClone(o);n.id=uid();n.title+=' (copie)';n.updated=Date.now();data.sequences.push(n)})});$$('[data-archive]').forEach(el=>el.onclick=e=>{e.stopPropagation();if(confirm('Archiver cette séquence ?'))mutate(()=>data.sequences.find(s=>s.id===el.dataset.archive).archived=true)});$$('[data-visual]').forEach(el=>el.onclick=()=>{visual=el.dataset.visual;render()});$$('[data-editstep]').forEach(el=>el.onclick=()=>editStep(el.dataset.editstep));$$('[data-delstep]').forEach(el=>el.onclick=()=>{if(confirm('Supprimer cette étape ?'))mutate(()=>{seq().steps=seq().steps.filter(st=>st.id!==el.dataset.delstep)})});$$('[data-upstep],[data-downstep]').forEach(el=>el.onclick=()=>{let id=el.dataset.upstep||el.dataset.downstep,delta=el.dataset.upstep?-1:1;mutate(()=>{let arr=seq().steps,i=arr.findIndex(st=>st.id===id),j=i+delta;if(i>=0&&j>=0&&j<arr.length)[arr[i],arr[j]]=[arr[j],arr[i]]})});$$('[data-addstep]').forEach(el=>el.onclick=addStep);$$('[data-addobj]').forEach(el=>el.onclick=()=>addObjective());$$('[data-addobjcat]').forEach(el=>el.onclick=()=>addObjective(el.dataset.addobjcat));$$('[data-editobj]').forEach(el=>el.onclick=()=>editObj(el.dataset.editobj));$$('[data-delobj]').forEach(el=>el.onclick=()=>{if(confirm('Supprimer cet objectif ?'))mutate(()=>{seq().objectives=seq().objectives.filter(o=>o.id!==el.dataset.delobj);delete seq().links[el.dataset.delobj]})});$$('[data-goto]').forEach(el=>el.onclick=()=>go(el.dataset.goto));$$('[data-link]').forEach(el=>el.onchange=()=>{let [o,st]=el.dataset.link.split('|'),val=el.value;mutate(()=>{seq().links[o]??={};if(val)seq().links[o][st]=val;else delete seq().links[o][st]})});$$('[data-mgroup]').forEach(el=>el.onclick=()=>{if(el.dataset.mgroup==='Séances')go('designer');else if(el.dataset.mgroup==='Tâche finale')go('designer');else go('objectives')});if($('#search'))$('#search').oninput=e=>{let q=e.target.value;$('#cards').innerHTML=cards(q);$$('[data-open]').forEach(el=>el.onclick=e=>{e.stopPropagation();activeId=el.dataset.open;go('designer')});$$('[data-dup]').forEach(el=>el.onclick=e=>{e.stopPropagation();let o=data.sequences.find(s=>s.id===el.dataset.dup);mutate(()=>{let n=structuredClone(o);n.id=uid();n.title+=' (copie)';data.sequences.push(n)})})};if($('#pngBtn'))$('#pngBtn').onclick=exportPNG;if($('#jsonDownload'))$('#jsonDownload').onclick=saveJSON;if($('#jsonImport'))$('#jsonImport').onclick=()=>$('#importFile').click()}
$('#newBtn').onclick=()=>{let title=ask('Nom de la nouvelle séquence','My New Sequence');if(!title)return;mutate(()=>{let s={id:uid(),title,level:'5e',axis:'',problem:'',cefr:'A1–A2',duration:'',prerequisites:'',finalTask:{title:'',context:'',audience:'',product:'',criteria:''},objectives:[],steps:[],links:{},updated:Date.now(),archived:false,favorite:false};data.sequences.unshift(s);activeId=s.id});go('designer')};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>doImport(e.target.files?.[0]);$('#exportBtn').onclick=()=>go('export');document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(history.length){redo.push(JSON.stringify(data));data=JSON.parse(history.pop());persist();render()}}if((e.ctrlKey||e.metaKey)&&e.key==='y'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(redo.length){history.push(JSON.stringify(data));data=JSON.parse(redo.pop());persist();render()}}});render();
</script></body></html>
